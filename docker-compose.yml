name: richard-resume-analyzer

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: richard-resume-analyzer-db
    env_file:
      - ${HOME}/richard-resume-analyzer/.env
    volumes:
      - ${HOME}/richard-resume-analyzer/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-resume_analyzer}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
      cache_from:
        - type=local,src=${HOME}/richard-resume-analyzer/cache/buildkit/backend
      cache_to:
        - type=local,dest=${HOME}/richard-resume-analyzer/cache/buildkit/backend,mode=max
    image: richard-resume-analyzer-backend:local
    container_name: richard-resume-analyzer-backend
    env_file:
      - ${HOME}/richard-resume-analyzer/.env
    volumes:
      - ${HOME}/richard-resume-analyzer/data/uploads:/var/lib/resume-analyzer/uploads
      - ${HOME}/richard-resume-analyzer/data/logs:/var/log/resume-analyzer
      - ${HOME}/richard-resume-analyzer/cache/huggingface:/var/cache/resume-analyzer/huggingface
      - ${HOME}/richard-resume-analyzer/cache/torch:/var/cache/resume-analyzer/torch
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8000}:8000"
    restart: unless-stopped
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      cache_from:
        - type=local,src=${HOME}/richard-resume-analyzer/cache/buildkit/frontend
      cache_to:
        - type=local,dest=${HOME}/richard-resume-analyzer/cache/buildkit/frontend,mode=max
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: richard-resume-analyzer-frontend:local
    container_name: richard-resume-analyzer-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
