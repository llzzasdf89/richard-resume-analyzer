services:
  backend:
    build: ./backend
    container_name: resume-analyzer-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: resume-analyzer-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_network

  db:
    image: pgvector/pgvector:pg16
    container_name: resume-analyzer-db
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app_network

volumes:
  pgdata:

networks:
  app_network:
    driver: bridge
