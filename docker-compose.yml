services:
  backend:
    build: ./backend
    container_name: richard-resume-analyzer-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: richard-resume-analyzer-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app_network

  db:
    image: pgvector/pgvector:pg16
    container_name: richard-resume-analyzer-db
    environment:
      POSTGRES_DB: resume_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - app_network

volumes:
  pgdata:
  uploads:
  logs:

networks:
  app_network:
    driver: bridge
