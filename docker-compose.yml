name: richard-resume-analyzer

services:
  backend:
    image: richard-resume-analyzer-backend:latest
    container_name: richard-resume-analyzer-backend
    env_file:
      - ${HOME}/richard-resume-analyzer/.env
    volumes:
      - ${HOME}/richard-resume-analyzer/data/uploads:/var/lib/resume-analyzer/uploads
      - ${HOME}/richard-resume-analyzer/data/logs:/var/log/resume-analyzer
      - ${HOME}/richard-resume-analyzer/cache/huggingface:/var/cache/resume-analyzer/huggingface
      - ${HOME}/richard-resume-analyzer/cache/torch:/var/cache/resume-analyzer/torch
    ports:
      - "${BACKEND_PORT:-127.0.0.1:8000}:8000"
    restart: unless-stopped
    networks:
      - app_network

networks:
  app_network:
    driver: bridge
