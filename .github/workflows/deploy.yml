name: Deploy to GCP VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Resume Analyzer
    runs-on: ubuntu-latest
    environment: deploy

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 60m
          script: |
            set -e

            PROJECT_DIR=$HOME/richard-resume-analyzer

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "First deployment..."
              git clone https://github.com/llzzasdf89/richard-resume-analyzer.git "$PROJECT_DIR"
            fi

            cd "$PROJECT_DIR"

            if [ ! -f "$PROJECT_DIR/.env" ]; then
              echo "Missing $PROJECT_DIR/.env"
              exit 1
            fi

            echo "Pull latest code..."
            git pull origin main

            echo "Build containers..."
            docker compose --env-file "$PROJECT_DIR/.env" up -d --build

            echo "Remove unused images..."
            docker image prune -af

            echo "Deployment completed."
