name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  # ── 后端：构建镜像推送到 ECR ──────────────────────────────
  deploy-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    environment: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        working-directory: backend
        run: |
          IMAGE_URI=${{ secrets.ECR_REGISTRY }}/richard-resume-analyzer:latest
          docker build --platform linux/amd64 -t $IMAGE_URI .
          docker push $IMAGE_URI

  # ── 前端：构建静态文件 ────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    environment: deploy # 加这行

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ── 部署：拉取镜像 + 上传前端到服务器 ────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [deploy-backend, build-frontend]
    environment: deploy # 加这行

    steps:
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload frontend to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/"
          target: "~/richard-resume-analyzer/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 登录 ECR
            aws ecr get-login-password --region ap-northeast-1 \
              | docker login --username AWS --password-stdin \
                865266771686.dkr.ecr.ap-northeast-1.amazonaws.com

            # 拉取镜像并重启
            cd ~/richard-resume-analyzer
            docker compose pull
            docker compose up -d

            echo "部署完成"
